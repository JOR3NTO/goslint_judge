name: Deploy in AWS S3 Student APP
on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/apps/student-app/**"
      # Compartidos del workspace: cambian las dependencias instaladas
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/brand/**"
      - ".github/workflows/student.yml"

# Un despliegue por rama a la vez; sin cancelar para no dejar un sync a medias
concurrency:
  group: student-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ github.ref_name == 'main' && vars.API_BASE_URL || vars.API_BASE_URL_DEV }}
      NEXT_PUBLIC_WS_URL:       ${{ github.ref_name == 'main' && vars.WS_URL       || vars.WS_URL_DEV }}
      NEXT_PUBLIC_LANDING_URL:  ${{ github.ref_name == 'main' && vars.LANDING_URL  || vars.LANDING_URL_DEV }}
      NEXT_PUBLIC_USE_MOCK: "false"
      S3_BUCKET: ${{ github.ref_name == 'main' && secrets.STUDENT_S3_BUCKET || secrets.STUDENT_S3_BUCKET_DEV }}
    steps:
      - name: Check variables
        run: |
          test -n "${{ secrets.S3_ENDPOINT }}" || { echo "::error::Falta secrets.S3_ENDPOINT"; exit 1; }
          if [ "${{ github.ref_name }}" = "main" ]; then
            test -n "${{ vars.API_BASE_URL }}" || { echo "::error::Falta vars.API_BASE_URL"; exit 1; }
            test -n "${{ vars.WS_URL }}"       || { echo "::error::Falta vars.WS_URL"; exit 1; }
            test -n "${{ vars.LANDING_URL }}"  || { echo "::error::Falta vars.LANDING_URL"; exit 1; }
            test -n "${{ secrets.STUDENT_S3_BUCKET }}" || { echo "::error::Falta secrets.STUDENT_S3_BUCKET"; exit 1; }
          else
            test -n "${{ vars.API_BASE_URL_DEV }}" || { echo "::error::Falta vars.API_BASE_URL_DEV"; exit 1; }
            test -n "${{ vars.WS_URL_DEV }}"       || { echo "::error::Falta vars.WS_URL_DEV"; exit 1; }
            test -n "${{ vars.LANDING_URL_DEV }}"  || { echo "::error::Falta vars.LANDING_URL_DEV"; exit 1; }
            test -n "${{ secrets.STUDENT_S3_BUCKET_DEV }}" || { echo "::error::Falta secrets.STUDENT_S3_BUCKET_DEV"; exit 1; }
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build the project
        working-directory: ./frontend
        run: pnpm --filter @uceva-judge/student-app build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-out
          path: frontend/apps/student-app/out
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ github.ref_name == 'main' && secrets.STUDENT_S3_BUCKET || secrets.STUDENT_S3_BUCKET_DEV }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: student-out
          path: ./out

      - name: Install AWS CLI
        run: |
          pip install awscli

      # RustFS es compatible con S3: el CLI apunta a su endpoint y usa rutas /bucket/clave.
      # HTML y payloads RSC sin caché; _next/static lleva hash en el nombre y se cachea para siempre.
      # Orden: chunks nuevos → HTML nuevo → borrar chunks viejos, para que ningún HTML apunte a un chunk inexistente.
      - name: Deploy to S3
        working-directory: ./out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          aws configure set default.s3.addressing_style path
          aws s3 sync _next/static "s3://$S3_BUCKET/_next/static" --endpoint-url "$S3_ENDPOINT" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync . "s3://$S3_BUCKET" --endpoint-url "$S3_ENDPOINT" --delete --exclude "_next/static/*" --cache-control "no-cache"
          aws s3 sync _next/static "s3://$S3_BUCKET/_next/static" --endpoint-url "$S3_ENDPOINT" --delete --cache-control "public,max-age=31536000,immutable"
