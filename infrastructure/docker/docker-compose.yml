name: goslint-judge

# ---------------------------------------------------------------------------
# Bloques reutilizables (anclas YAML). Se definen una vez y cada servicio los
# incorpora con "<<: *nombre", asi no se repite (ni se desincroniza) la config.
# Las variables ${...} se leen de infrastructure/docker/.env (ver .env.example).
# ---------------------------------------------------------------------------
x-jwt-env: &jwt-env
  # OBLIGATORIA, minimo 32 caracteres. Es la MISMA para todos los servicios: auth-service
  # firma los tokens con ella y los demas los validan. Si falta, compose se detiene con
  # este mensaje en vez de arrancar servicios que luego mueren.
  JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en infrastructure/docker/.env (minimo 32 caracteres)}
  # Tambien debe ser igual en todos: los validadores rechazan tokens de otro emisor.
  JWT_ISSUER: ${JWT_ISSUER:-goslint-judge}

x-db-env: &db-env
  # Dentro de la red de compose, el host de la base de datos es el NOMBRE del servicio
  # ("postgres"), no localhost: cada contenedor tiene su propio localhost.
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-goslint_judge_db}
  DB_USERNAME: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

services:
  postgres:
    image: postgres:16-alpine
    container_name: goslint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goslint_judge_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-goslint_judge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: goslint-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # Puerto AMQP al que se conectan los microservicios
      - "${RABBITMQ_PORT:-5672}:5672"
      # Consola web de administracion (http://localhost:15672)
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      # Volumen nombrado: las colas duraderas y sus mensajes sobreviven
      # a un reinicio del contenedor, que es lo que hace que un envio
      # encolado no se pierda si el broker se cae.
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Sandbox de evaluacion. Perfil "sandbox": NO arranca con un 'docker compose up'
  # normal, porque exige que goslint.slice exista en el host (ver
  # backend/services/judge-service/docs/REQUIREMENTS.md). Sin ese requisito, los
  # demas servicios de este archivo seguirian levantando igual.
  #
  #   sudo cp ../systemd/goslint.slice /etc/systemd/system/ && sudo systemctl enable --now goslint.slice
  #   JWT_SECRET=... docker compose --profile sandbox up -d --build judge-service
  #   docker logs goslint-judge | grep "delegacion de cgroups OK"
  #   docker exec -u ubuntu goslint-judge sh /opt/judge/prueba_humo.sh
  judge-service:
    profiles: ["sandbox"]
    build:
      context: ../../backend
      dockerfile: services/judge-service/docker/Dockerfile
      args:
        # "false" en produccion: quita ps, pgrep y strace de la imagen.
        WITH_DEBUG_TOOLS: "${JUDGE_DEBUG_TOOLS:-true}"
    image: goslint-judge:dev
    container_name: goslint-judge
    restart: "no"

    # tini como PID 1: recoge los procesos zombi que deje una evaluacion.
    init: true

    # --- Cgroups: el contenedor nace DENTRO de la rama preparada en el host ---
    cgroup: host                      # --cgroupns=host
    cgroup_parent: goslint.slice      # --cgroup-parent=goslint.slice

    volumes:
      # Escritura sobre UNA sola rama del cgroupfs, no sobre todo /sys/fs/cgroup.
      # create_host_path: false -> si la slice no existe, falla en claro en vez de
      # crear un directorio vacio sin controladores que daria errores raros.
      - type: bind
        source: /sys/fs/cgroup/goslint.slice
        target: /cg
        bind:
          create_host_path: false

    # Directorios de trabajo por ejecucion (/work/worker-<n>/<uuid>) en RAM: se pierden al
    # reiniciar y no dejan basura. uid/gid 1000 = usuario 'ubuntu' de la imagen.
    #
    # 'exec' es obligatorio para C y C++: Docker monta los tmpfs con noexec por
    # defecto, y aqui viven los binarios ya compilados que luego se montan como
    # /solution dentro del sandbox. Sin 'exec', el noexec se propaga al bind y el
    # exec del binario falla con "Permission denied", que el juez reporta como
    # RUNTIME_ERROR culpando al estudiante de una limitacion de la plataforma.
    # No relaja el sandbox: el /work escribible que ve el codigo evaluado es otro
    # tmpfs, el que monta bwrap, y ese ya era exec. nosuid y nodev siguen puestos.
    tmpfs:
      - /work:mode=0755,uid=1000,gid=1000,exec,size=${JUDGE_WORK_SIZE:-256m}

    security_opt:
      # bwrap necesita mount, pivot_root y unshare, que el perfil por defecto de
      # Docker bloquea. El codigo evaluado NO queda sin filtro: bwrap le carga el
      # suyo, generado por gen_seccomp.py.
      - seccomp=unconfined
      # El perfil docker-default de AppArmor trae 'deny mount' (Ubuntu/Debian).
      - apparmor=unconfined
      # Quita las mascaras de /proc para que 'bwrap --proc /proc' funcione y cada
      # ejecucion vea solo sus propios PIDs.
      - systempaths=unconfined

    # NO se anade cap_add ni privileged. Si alguien lo propone "para que funcione",
    # falta alguno de los flags de arriba.

    ports:
      - "${JUDGE_PORT:-8084}:8084"

    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # judge-service no usa Redis en su codigo, pero 'shared' arrastra
      # spring-data-redis y el health indicator del actuator intenta conectar.
      # Sin esto apunta a localhost:6379 dentro del contenedor, donde no hay nada,
      # y /actuator/health queda DOWN llenando el log de stack traces.
      SPRING_DATA_REDIS_HOST: redis
      # problem-service corre en este mismo compose: se le llama por su nombre de
      # servicio. Para apuntar a uno que corra en el host (por Gradle), defina
      # PROBLEM_SERVICE_URL=http://host.docker.internal:8082 en el .env.
      PROBLEM_SERVICE_URL: ${PROBLEM_SERVICE_URL:-http://problem-service:8082}
      # JWT_SECRET (obligatoria, sin valor por defecto: un secreto de ejemplo aceptaria
      # tokens falsificados) y JWT_ISSUER: ver el ancla x-jwt-env al inicio del archivo.
      <<: *jwt-env
      # DEBUG vuelca, por caso de prueba, el comando de bwrap, stdout, stderr y el
      # motivo del veredicto. Incluye la salida del codigo evaluado y la esperada
      # de los casos de prueba, asi que se deja en INFO salvo cuando se depura.
      # No requiere reconstruir la imagen: basta recrear el contenedor.
      JUDGE_SANDBOX_LOG_LEVEL: ${JUDGE_SANDBOX_LOG_LEVEL:-INFO}
      # Evaluaciones simultaneas (workers). Dimensionar por nucleos y memoria: cada
      # una puede llegar al limite de memoria de su problema, y /work (JUDGE_WORK_SIZE)
      # guarda a la vez los fuentes y binarios de todas.
      JUDGE_WORKERS: ${JUDGE_WORKERS:-2}
      # Tiempo maximo de una evaluacion completa antes de dar al worker por colgado.
      JUDGE_EVALUATION_TIMEOUT_SECONDS: ${JUDGE_EVALUATION_TIMEOUT_SECONDS:-300}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      rabbitmq:
        condition: service_healthy
      # Aunque el judge no lo use, el health indicator de Redis esta activo: si el
      # contenedor no esta arriba, 'up judge-service' arranca con el log inundado.
      redis:
        condition: service_healthy
      # Descarga de los casos de prueba privados al evaluar.
      problem-service:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: goslint-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Servicios de aplicacion (Spring Boot). Se construyen desde el codigo con el
  # Dockerfile generico backend/docker/spring-service.Dockerfile.
  #
  # No tienen actuator, asi que el healthcheck solo comprueba que el puerto este
  # abierto: Tomcat abre el puerto al final del arranque, cuando Flyway, JPA y
  # Redis ya estan listos.
  # -------------------------------------------------------------------------
  auth-service:
    build:
      context: ../../backend
      dockerfile: docker/spring-service.Dockerfile
      args:
        SERVICE: auth-service
    image: goslint-auth-service:dev
    container_name: goslint-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      <<: [*db-env, *jwt-env]
      REDIS_HOST: redis
      # Origenes del frontend que pueden llamar a la API desde el navegador.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # El super administrador se crea al arrancar si aun no existe ninguno.
      # Sin estas dos variables no se crea y solo queda un aviso en el log.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  problem-service:
    build:
      context: ../../backend
      dockerfile: docker/spring-service.Dockerfile
      args:
        SERVICE: problem-service
    image: goslint-problem-service:dev
    container_name: goslint-problem
    restart: unless-stopped
    ports:
      - "${PROBLEM_PORT:-8082}:8082"
    environment:
      <<: [*db-env, *jwt-env]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  submission-service:
    build:
      context: ../../backend
      dockerfile: docker/spring-service.Dockerfile
      args:
        SERVICE: submission-service
    image: goslint-submission-service:dev
    container_name: goslint-submission
    restart: unless-stopped
    ports:
      - "${SUBMISSION_PORT:-8083}:8083"
    environment:
      <<: [*db-env, *jwt-env]
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
