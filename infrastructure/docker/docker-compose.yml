name: goslint-judge

services:
  postgres:
    image: postgres:16-alpine
    container_name: goslint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goslint_judge_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-goslint_judge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: goslint-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # Puerto AMQP al que se conectan los microservicios
      - "${RABBITMQ_PORT:-5672}:5672"
      # Consola web de administracion (http://localhost:15672)
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      # Volumen nombrado: las colas duraderas y sus mensajes sobreviven
      # a un reinicio del contenedor, que es lo que hace que un envio
      # encolado no se pierda si el broker se cae.
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  rabbitmq-data:
