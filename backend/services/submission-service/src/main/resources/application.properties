spring.application.name=submission-service
server.port=8083

# Data Source
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goslint_judge_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# validate y no update: el esquema lo define Flyway, Hibernate solo comprueba que
# la tabla coincide con la entidad y aborta el arranque si no es asi.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Migraciones de esquema (Flyway) ---
# Se ejecutan antes de la validacion de Hibernate, de modo que un despliegue sobre
# una base de datos ya creada aplica los cambios de esquema por si mismo.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# La base de datos es compartida por todos los microservicios: cada uno lleva su
# propio historial para no pisar el de los demas.
spring.flyway.table=flyway_schema_history_submission
# El esquema puede no estar vacio (tablas de otros servicios, o la propia tabla de
# envios creada en su dia por ddl-auto). Se toma como linea base la version 0 para
# que ninguna migracion se de por aplicada sin haberse ejecutado; las migraciones
# estan escritas de forma idempotente para tolerar ese punto de partida.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Mensajeria (RabbitMQ) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Confirmaciones del broker: sin ellas no se puede saber si un envio quedo encolado
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Primer nivel de reintento: cortes breves de conexion con el broker
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.max-interval=10s

# --- Encolamiento de envios ---
# Estas claves son la unica fuente de verdad de la topologia: RabbitConfig declara
# el exchange, las colas y los bindings a partir de ellas, y el publicador envia a
# esos mismos valores. Cambiar una aqui mueve ambos lados a la vez.
app.messaging.enabled=true
app.messaging.submission.exchange=submission.exchange
app.messaging.submission.routing-key=submission.evaluate
app.messaging.submission.queue=submission.evaluate
app.messaging.submission.dead-letter-exchange=submission.dlx
app.messaging.submission.dead-letter-queue=submission.evaluate.dlq
app.messaging.confirm-timeout-ms=5000

# Segundo nivel de reintento: caidas prolongadas del broker o del propio servicio
app.submission.retry.interval-ms=30000
app.submission.retry.grace-period-ms=15000
app.submission.retry.batch-size=50

# --- Devolucion del veredicto (judge-service -> submission-service) ---
# Contraparte del encolamiento: judge-service publica en el mismo exchange con la
# routing key de veredictos, y este servicio consume la cola resultante. Los envios
# cuyo veredicto no pueda registrarse acaban en su propia cola de fallidos.
app.messaging.submission.judged-routing-key=submission.judged
app.messaging.submission.judged-queue=submission.judged
app.messaging.submission.judged-dead-letter-queue=submission.judged.dlq

# Reintentos del consumidor. Agotados los intentos, el mensaje NO se vuelve a
# encolar: se deriva a la cola de fallidos, donde el listener correspondiente marca
# el envio como SYSTEM_ERROR. Sin default-requeue-rejected=false el mensaje giraria
# indefinidamente entre la cola y el consumidor sin llegar nunca a la DLQ.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Notificacion en tiempo real (WebSocket) ---
# Canal de solo notificacion: el servidor empuja el estado de los envios y no
# procesa nada de lo que el cliente envie.
app.websocket.submission.path=/ws/submissions
# Los navegadores no permiten fijar cabeceras al abrir un WebSocket, asi que el
# cliente anuncia dos subprotocolos: este, que el servidor confirma, y
# "bearer.<token>", del que se extrae el JWT durante el handshake.
app.websocket.submission.sub-protocol=goslint-judge
app.websocket.allowed-origins=*

# BYPASS TEMPORAL DE AUTENTICACION HTTP - SOLO PARA PRUEBAS LOCALES.
# En true, registra TemporaryAuthBypassFilter, que autentica cualquier
# peticion REST con todos los roles del sistema (SecurityConfig). Hoy no hay
# filtro JWT para peticiones HTTP -solo el handshake del WebSocket valida un
# token de verdad-, asi que sin esto @PreAuthorize rechaza todo con 403.
# Debe quedar en false salvo en un entorno de prueba local, y esta propiedad
# (junto con TemporaryAuthBypassFilter) se retira en cuanto exista ese filtro.
app.security.bypass-auth=${AUTH_BYPASS:false}

# --- Autenticacion (JWT) ---
# Clave compartida con auth-service, que es quien emite los tokens. Sin valor por
# defecto de forma deliberada: un secreto de ejemplo heredado en produccion
# aceptaria tokens falsificados. Minimo 32 bytes (HMAC-SHA256).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:goslint-judge}

# --- Composicion de equipos ---
# Fuente desde la que se resuelven los integrantes de un equipo, que son los
# destinatarios de la notificacion. Mientras contest-service no exista, "noop"
# resuelve cada equipo como individual.
app.team-membership.provider=noop
