spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.flyway.enabled=false

# Las pruebas no necesitan un broker en marcha: se usa el publicador NoOp
# y se evita que Spring Boot intente configurar una conexion a RabbitMQ.
app.messaging.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Clave de firma solo para pruebas: los tests no comparten secretos con ningun
# entorno real, pero el validador exige al menos 32 bytes (HMAC-SHA256).
app.security.jwt.secret=clave-de-pruebas-solo-para-tests-0123456789
app.security.jwt.issuer=goslint-judge

app.websocket.submission.path=/ws/submissions
app.websocket.submission.sub-protocol=goslint-judge
app.websocket.allowed-origins=*
