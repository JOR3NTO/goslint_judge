spring.application.name=contests-platform
server.port=${SERVER_PORT:8080}

# Data Source
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goslint_judge_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-jwt-secret-goslint-judge-2026-change-in-production}
# Emisor de los tokens. Debe coincidir con app.security.jwt.issuer de los demás servicios,
# que rechazan los tokens de cualquier otro emisor.
jwt.issuer=${JWT_ISSUER:goslint-judge}
# 15 minutos en ms (900000)
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:900000}
# 8 horas en ms (28800000)
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:28800000}

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- Autenticacion (JWT) ---
# Clave con la que el módulo auth firma los tokens y el resto los valida. Sin valor por
# defecto de forma deliberada: un secreto de ejemplo heredado en produccion
# aceptaria tokens falsificados. Minimo 32 bytes (HMAC-SHA256).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:goslint-judge}

# --- Migraciones de esquema (Flyway) ---
# La base de datos es compartida por todos los módulos: comparten el
# historial de Flyway (tabla propia de contest-platform).
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.table=${FLYWAY_TABLE:flyway_schema_history_contest}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# --- Correo (invitaciones a equipos) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@goslint.local}
# URL pública de este servicio (enlaces de los botones del correo) y del frontend de estudiantes.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Super administrador inicial (solo se crea si aún no existe ninguno).
# Defina SUPER_ADMIN_EMAIL y SUPER_ADMIN_PASSWORD; sin ellos no se crea.
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://192.168.18.51:3000,http://127.0.2.2:3000}

# --- Mensajeria (RabbitMQ) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Confirmaciones del broker: sin ellas no se puede saber si un envio quedo encolado
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Primer nivel de reintento: cortes breves de conexion con el broker
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.max-interval=10s

# --- Encolamiento de envios ---
# Estas claves son la unica fuente de verdad de la topologia: RabbitConfig declara
# el exchange, las colas y los bindings a partir de ellas, y el publicador envia a
# esos mismos valores. Cambiar una aqui mueve ambos lados a la vez.
app.messaging.enabled=true
app.messaging.submission.exchange=submission.exchange
app.messaging.submission.routing-key=submission.evaluate
app.messaging.submission.queue=submission.evaluate
app.messaging.submission.dead-letter-exchange=submission.dlx
app.messaging.submission.dead-letter-queue=submission.evaluate.dlq
app.messaging.confirm-timeout-ms=5000

# Segundo nivel de reintento: caidas prolongadas del broker o del propio servicio
app.submission.retry.interval-ms=30000
app.submission.retry.grace-period-ms=15000
app.submission.retry.batch-size=50

# --- Aviso de inicio de evaluacion (judge-service -> contest-platform) ---
# judge-service publica este aviso en cuanto toma un envio, antes de evaluarlo,
# para que el estado pase de QUEUED a JUDGING en lugar de seguir pareciendo "en
# cola" mientras el juez ya lo esta procesando. Los avisos que no puedan
# registrarse acaban en su propia cola de fallidos, igual que las otras dos.
app.messaging.submission.judging-routing-key=submission.judging
app.messaging.submission.judging-queue=submission.judging
app.messaging.submission.judging-dead-letter-queue=submission.judging.dlq

# --- Devolucion del veredicto (judge-service -> contest-platform) ---
# Contraparte del encolamiento: judge-service publica en el mismo exchange con la
# routing key de veredictos, y este servicio consume la cola resultante. Los envios
# cuyo veredicto no pueda registrarse acaban en su propia cola de fallidos.
app.messaging.submission.judged-routing-key=submission.judged
app.messaging.submission.judged-queue=submission.judged
app.messaging.submission.judged-dead-letter-queue=submission.judged.dlq

# Reintentos del consumidor. Agotados los intentos, el mensaje NO se vuelve a
# encolar: se deriva a la cola de fallidos, donde el listener correspondiente marca
# el envio como ENQUEUE_ERROR. Sin default-requeue-rejected=false el mensaje giraria
# indefinidamente entre la cola y el consumidor sin llegar nunca a la DLQ.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Notificacion en tiempo real (WebSocket) ---
# Canal de solo notificacion: el servidor empuja el estado de los envios y no
# procesa nada de lo que el cliente envie.
app.websocket.submission.path=/ws/submissions
# Los navegadores no permiten fijar cabeceras al abrir un WebSocket, asi que el
# cliente anuncia dos subprotocolos: este, que el servidor confirma, y
# "bearer.<token>", del que se extrae el JWT durante el handshake.
app.websocket.submission.sub-protocol=goslint-judge
app.websocket.allowed-origins=*