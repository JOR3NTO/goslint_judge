spring.application.name=judge-service
server.port=8084

# judge-service no persiste nada: los casos de prueba y los limites los consulta a
# problem-service y el resultado viaja por mensajeria. El build raiz agrega JPA a
# todos los modulos, asi que se excluye su autoconfiguracion para no exigir BD.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# --- Mensajeria (RabbitMQ) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Contrato con submission-service (ver su docs/RABBITMQ.md). La topologia la declara
# submission-service; judge-service solo consume la cola de evaluacion y publica el
# veredicto en el mismo exchange. NO se redeclaran colas aqui: una declaracion con
# argumentos distintos a los de la cola existente hace fallar el arranque.
app.messaging.submission.exchange=submission.exchange
app.messaging.submission.queue=submission.evaluate
app.messaging.submission.judged-routing-key=submission.judged
app.messaging.confirm-timeout-ms=5000

# Reintentos del consumidor. Agotados los intentos el mensaje va a
# submission.evaluate.dlq y submission-service cierra el envio como SYSTEM_ERROR.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# La evaluacion es pesada (CPU y cgroups): un envio a la vez por consumidor.
spring.rabbitmq.listener.simple.prefetch=1

# --- Cliente de problem-service ---
app.problem-service.base-url=${PROBLEM_SERVICE_URL:http://localhost:8082}
app.problem-service.connect-timeout-ms=3000
app.problem-service.read-timeout-ms=10000

# --- Autenticacion servicio a servicio (JWT) ---
# judge-service comparte la clave con auth-service y firma su propio token con
# role=SERVICE para leer los casos de prueba privados de problem-service. Sin valor
# por defecto de forma deliberada: un secreto de ejemplo heredado en produccion
# aceptaria tokens falsificados. Minimo 32 bytes (HMAC-SHA256).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:goslint-judge}
# Identidad (claim sub, UUID) con la que se presenta este servicio.
app.security.jwt.service-id=${JUDGE_SERVICE_ID:00000000-0000-0000-0000-000000000084}
app.security.jwt.service-token-ttl-seconds=300
