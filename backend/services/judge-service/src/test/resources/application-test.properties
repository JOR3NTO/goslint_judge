# Perfil "test": se activa con @ActiveProfiles("test") y se superpone al
# application.properties principal, sin reemplazarlo.

# El principal declara app.security.jwt.secret=${JWT_SECRET} sin valor por
# defecto a proposito, asi que sin esta linea no arranca ningun @SpringBootTest.
# Minimo 32 bytes (HMAC-SHA256). Solo para pruebas: nunca se usa fuera de aqui.
app.security.jwt.secret=clave-de-pruebas-de-al-menos-32-bytes!!!

# --- Topologia de RabbitMQ para pruebas ---
# judge-service no declara la topologia: la declara submission-service, dueno del
# contrato, y por eso su application.properties solo define las cuatro claves que
# necesita para operar (exchange, queue, judged-routing-key, confirm-timeout-ms).
#
# Una prueba contra un broker limpio si tiene que declararla, y para eso hacen
# falta las claves de abajo. Los valores son los mismos que usa submission-service
# en su application.properties: si divergen, la cola declarada aqui chocaria con
# la real y el broker respondera PRECONDITION_FAILED.
app.messaging.submission.routing-key=submission.evaluate
app.messaging.submission.dead-letter-exchange=submission.dlx
app.messaging.submission.dead-letter-queue=submission.evaluate.dlq
app.messaging.submission.judging-queue=submission.judging
app.messaging.submission.judging-dead-letter-queue=submission.judging.dlq
app.messaging.submission.judged-queue=submission.judged
app.messaging.submission.judged-dead-letter-queue=submission.judged.dlq
