spring.application.name=${SPRING_APPLICATION_NAME:auth-service}
server.port=${SERVER_PORT:8081}

# Data Source (Base de datos única para todo el sistema)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goslint_judge_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway (Desactivado temporalmente a petición)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-jwt-secret-goslint-judge-2026-change-in-production}
# Emisor de los tokens. Debe coincidir con app.security.jwt.issuer de los demás servicios,
# que rechazan los tokens de cualquier otro emisor.
jwt.issuer=${JWT_ISSUER:goslint-judge}
# 15 minutos en ms (900000)
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:900000}
# 8 horas en ms (28800000)
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:28800000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://192.168.18.51:3000,http://127.0.2.2:3000}

# Super administrador inicial (solo se crea si aún no existe ninguno).
# Defina SUPER_ADMIN_EMAIL y SUPER_ADMIN_PASSWORD; sin ellos no se crea.
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
