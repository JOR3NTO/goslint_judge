spring.application.name=auth-service
server.port=8081

# Data Source (Base de datos única para todo el sistema)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goslint_judge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway (Desactivado temporalmente a petición)
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-jwt-secret-goslint-judge-2026-change-in-production}
# 15 minutos en ms (900000)
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:900000}
# 8 horas en ms (28800000)
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:28800000}

# CORS
cors.allowed-origins=http://localhost:3000,http://192.168.18.51:3000
