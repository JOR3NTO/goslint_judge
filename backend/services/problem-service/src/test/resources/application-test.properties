spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Clave y emisor de prueba para el validador JWT (solo usados en tests)
app.security.jwt.secret=test-secret-key-at-least-32-bytes-long
app.security.jwt.issuer=goslint-judge

# Desactivar Flyway en pruebas (el esquema lo gestiona H2 con ddl-auto=create-drop)
spring.flyway.enabled=false

