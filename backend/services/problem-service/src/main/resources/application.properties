spring.application.name=problem-service

# Data Source
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goslint_judge_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Autenticacion (JWT) ---
# Clave compartida con auth-service, que es quien emite los tokens. Sin valor por
# defecto de forma deliberada: un secreto de ejemplo heredado en produccion
# aceptaria tokens falsificados. Minimo 32 bytes (HMAC-SHA256).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:goslint-judge}

# --- Migraciones de esquema (Flyway) ---
# La base de datos es compartida por todos los microservicios: cada uno lleva su
# propio historial para no pisar el de los demas.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.table=${FLYWAY_TABLE:flyway_schema_history_problem}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0